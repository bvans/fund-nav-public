name: Build JD 2026 NAV extract v2
on:
  push:
    branches: [main]
    paths: [".github/workflows/build-jd-nav-extract-v2.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas
      - run: python build_jd_nav_extract.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analysis/jd_2026_nav.json
          git diff --cached --quiet && exit 0
          git commit -m "data: rebuild JD 2026 NAV extract"
          git pull --rebase origin main
          git push origin HEAD:main
