name: Build JD 2026 NAV extract
on:
  push:
    branches: [main]
    paths: ["analysis_targets.json","build_jd_nav_extract.py",".github/workflows/build-jd-nav-extract.yml"]
permissions:
  contents: write
concurrency:
  group: fund-data-write
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pandas
      - run: python build_jd_nav_extract.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/analysis/jd_2026_nav.json
          git diff --cached --quiet && exit 0
          git commit -m "data: build JD 2026 NAV extract"
          git pull --rebase origin main
          git push origin HEAD:main
