name: Fetch CSI Dividend valuation (research)

on:
  workflow_dispatch:
  schedule:
    # Beijing 18:20 weekdays, UTC 10:20
    - cron: "20 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: csi-dividend-valuation
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency for recent official yield
        run: python -m pip install --disable-pip-version-check "akshare>=1.16,<2" "pandas>=2,<3" "openpyxl>=3,<4"
      - name: Fetch official CSI valuation
        run: python fetch_csi_dividend_valuation.py
      - name: Commit valuation data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/indices/valuation/000922/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: update CSI dividend valuation"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
