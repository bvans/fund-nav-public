name: Backfill JD missing NAVs
on:
  push:
    branches: [main]
    paths: [".github/workflows/backfill-jd-missing.yml"]
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python backfill_nav.py --start 2026-01-01 --end 2026-07-23 --codes "019260 003547 018099 022459 007751 001061 017423" --concurrency 4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/all/history
          git diff --cached --quiet && exit 0
          git commit -m "data: backfill JD missing NAV history"
          git pull --rebase origin main
          git push origin HEAD:main
