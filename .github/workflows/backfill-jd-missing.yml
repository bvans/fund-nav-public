name: Backfill JD missing NAVs
on:
  push:
    branches: [main]
    paths: [".github/workflows/backfill-jd-missing.yml"]

permissions:
  contents: write

concurrency:
  group: fund-data-write
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -r requirements.txt
      - name: Backfill NAVs needed by JD 2026 analysis
        run: >
          python backfill_nav.py
          --start 2026-01-01
          --end 2026-09-30
          --codes "000218 000480 005051 005613 008163 008928 013127 013308 016452 017436 017641 017644 017937 018043 019172 019524 021550 024772 025958 160213 501060"
          --concurrency 4
      - name: Rebuild JD NAV extract
        run: python build_jd_nav_extract.py
      - name: Commit backfilled NAVs and rebuilt extract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/all/history data/analysis/jd_2026_nav.json
          git diff --cached --quiet && exit 0
          git commit -m "data: backfill JD NAV history and rebuild extract"
          git pull --rebase origin main
          git push origin HEAD:main
