name: Query fund NAV on demand

on:
  push:
    branches:
      - main
    paths:
      - "query.json"

permissions:
  contents: write

concurrency:
  group: fund-nav-query
  cancel-in-progress: false

jobs:
  query-nav:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Read query
        id: query
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          from pathlib import Path

          q = json.loads(Path("query.json").read_text(encoding="utf-8"))
          request_id = str(q.get("request_id") or "").strip()
          codes = q.get("codes") or []

          if not request_id:
              raise SystemExit("query.json: request_id is required")
          if not isinstance(codes, list) or not codes:
              raise SystemExit("query.json: codes must be a non-empty array")

          print("REQUEST_ID=" + request_id)
          print("FUND_CODES=" + ",".join(str(x).strip() for x in codes))
          PY

      - name: Fetch official NAVs
        run: python fetch_nav.py

      - name: Commit query result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manual_latest_nav.json data/manual_latest_nav.csv
          if git diff --cached --quiet; then
            echo "No query result changes."
            exit 0
          fi
          git commit -m "data: update ad hoc fund NAV query"
          git pull --rebase origin main
          git push origin HEAD:main
