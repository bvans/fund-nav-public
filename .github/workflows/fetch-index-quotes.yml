name: Fetch Eastmoney index quotes

on:
  workflow_dispatch:
    inputs:
      source:
        description: "External trigger source"
        required: false
        default: "manual"
        type: string
      scheduled_at:
        description: "Scheduler timestamp"
        required: false
        default: ""
        type: string
  schedule:
    # Explicit Shanghai timezone avoids manual UTC conversion ambiguity.
    - cron: "27 11 * * 1-5"
      timezone: "Asia/Shanghai"
    - cron: "45 14 * * 1-5"
      timezone: "Asia/Shanghai"
    - cron: "10 15 * * 1-5"
      timezone: "Asia/Shanghai"
    - cron: "30 21 * * 1-5"
      timezone: "Asia/Shanghai"
  push:
    branches:
      - main
    paths:
      - "indices.json"
      - "fetch_index_quotes.py"
      - "requirements.txt"
      - "tests/test_index_quotes.py"
      - "verify_index_quote.py"
      - "trigger/index-refresh.txt"
      - ".github/workflows/fetch-index-quotes.yml"

permissions:
  contents: write

concurrency:
  group: index-data-write
  cancel-in-progress: true

jobs:
  fetch-index-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install httpx==0.28.1

      - name: Test index quote parsing
        run: python -m unittest tests.test_index_quotes -v

      - name: Fetch Eastmoney index quotes
        shell: bash
        run: |
          set -euo pipefail
          echo "UTC now: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Shanghai now: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Event name: ${{ github.event_name }}"
          echo "Triggered schedule: ${{ github.event.schedule }}"
          echo "Dispatch source: ${{ inputs.source }}"
          echo "Dispatch scheduled_at: ${{ inputs.scheduled_at }}"
          for attempt in 1 2 3; do
            if python fetch_index_quotes.py && python verify_index_quote.py; then
              exit 0
            fi
            echo "::warning::Attempt $attempt failed or quote stale"
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          echo "::error::Eastmoney quote not valid after retries"
          exit 1

      - name: Commit index data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Preserve the already fetched + verified output. If main advances
          # while we are running, do not hit Eastmoney again just to resolve
          # a Git race.
          rm -rf /tmp/generated-indices
          cp -a data/indices /tmp/generated-indices

          quote_epoch() {
            python - "$1" <<'PY'
          import json
          import sys
          from pathlib import Path

          p = Path(sys.argv[1]) / "latest.json"
          if not p.exists():
              print(0)
              raise SystemExit

          data = json.loads(p.read_text(encoding="utf-8"))
          row = next((x for x in data.get("indices", []) if x.get("code") == "000852"), None)
          print(int((row or {}).get("source_epoch") or 0))
          PY
          }

          publish_generated() {
            git add data/indices/
            if git diff --cached --quiet; then
              echo "No index quote changes."
              return 0
            fi
            git commit -m "data: update Eastmoney index quotes"
            git push origin HEAD:main
          }

          if publish_generated; then
            exit 0
          fi

          generated_epoch="$(quote_epoch /tmp/generated-indices)"

          # A concurrent/unrelated commit may move main after checkout.
          # Rebase/merge of generated JSON is intentionally avoided.
          for attempt in 2 3 4; do
            echo "::warning::Publish raced with main; reconciling generated data (attempt $attempt)"
            git fetch origin main
            git reset --hard origin/main

            remote_epoch="$(quote_epoch data/indices)"
            if [ "$remote_epoch" -ge "$generated_epoch" ] && [ "$remote_epoch" -gt 0 ]; then
              echo "Remote already contains the same or newer market quote; nothing to publish."
              exit 0
            fi

            rm -rf data/indices
            cp -a /tmp/generated-indices data/indices

            if publish_generated; then
              exit 0
            fi
            sleep 2
          done

          echo "::error::Could not publish verified index data after retrying"
          exit 1
