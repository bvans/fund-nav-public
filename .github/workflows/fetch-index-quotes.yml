name: Fetch Eastmoney index quotes

on:
  workflow_dispatch:
  schedule:
    # Asia/Shanghai 11:17, 11:27, 14:45, 15:10 on weekdays; allow time for 11:35 monitoring.
    - cron: "17 3 * * 1-5"
    - cron: "27 3 * * 1-5"
    - cron: "45 6 * * 1-5"
    - cron: "10 7 * * 1-5"
  push:
    branches:
      - main
    paths:
      - "indices.json"
      - "fetch_index_quotes.py"
      - "requirements.txt"
      - "tests/test_index_quotes.py"
      - ".github/workflows/fetch-index-quotes.yml"

permissions:
  contents: write

concurrency:
  group: index-data-write
  cancel-in-progress: false

jobs:
  fetch-index-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install httpx==0.28.1

      - name: Test index quote parsing
        run: python -m unittest tests.test_index_quotes -v

      - name: Fetch Eastmoney index quotes
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python fetch_index_quotes.py && python -c 'import json,datetime; d=json.load(open("data/indices/latest.json")); r=next(x for x in d["indices"] if x["code"]=="000852"); now=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))); t=datetime.datetime.fromisoformat(r["source_time"]); assert d["source"]=="eastmoney:push2" and r["source_date"]==now.date().isoformat() and r["price"] is not None and r["pct_change"] is not None and 0<=(now-t).total_seconds()<=7200, "stale or invalid quote"; print("Verified",r["price"],t)'; then
              exit 0
            fi
            echo "::warning::Attempt $attempt failed or quote stale"
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          echo "::error::Eastmoney quote not fresh after retries"
          exit 1

      - name: Commit index data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/indices/
          if git diff --cached --quiet; then
            echo "No index quote changes."
            exit 0
          fi
          git commit -m "data: update Eastmoney index quotes"
          git pull --rebase origin main
          git push origin HEAD:main
