name: Fetch Eastmoney index quotes

on:
  workflow_dispatch:
  schedule:
    # Explicit Shanghai timezone avoids manual UTC conversion ambiguity.
    - cron: "27 11 * * 1-5"
      timezone: "Asia/Shanghai"
    - cron: "45 14 * * 1-5"
      timezone: "Asia/Shanghai"
    - cron: "10 15 * * 1-5"
      timezone: "Asia/Shanghai"
    - cron: "30 21 * * 1-5"
      timezone: "Asia/Shanghai"
  push:
    branches:
      - main
    paths:
      - "indices.json"
      - "fetch_index_quotes.py"
      - "requirements.txt"
      - "tests/test_index_quotes.py"
      - "verify_index_quote.py"
      - "trigger/index-refresh.txt"
      - ".github/workflows/fetch-index-quotes.yml"

permissions:
  contents: write

concurrency:
  group: index-data-write
  cancel-in-progress: true

jobs:
  fetch-index-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install httpx==0.28.1

      - name: Test index quote parsing
        run: python -m unittest tests.test_index_quotes -v

      - name: Fetch Eastmoney index quotes
        shell: bash
        run: |
          set -euo pipefail
          echo "UTC now: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Shanghai now: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Triggered schedule: ${{ github.event.schedule }}"
          for attempt in 1 2 3; do
            if python fetch_index_quotes.py && python verify_index_quote.py; then
              exit 0
            fi
            echo "::warning::Attempt $attempt failed or quote stale"
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          echo "::error::Eastmoney quote not valid after retries"
          exit 1

      - name: Commit index data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_and_push() {
            git add data/indices/
            if git diff --cached --quiet; then
              echo "No index quote changes."
              return 0
            fi
            git commit -m "data: update Eastmoney index quotes"
            git push origin HEAD:main
          }

          if commit_and_push; then
            exit 0
          fi

          # Another refresh may have updated main while this run was fetching.
          # Generated market data should be regenerated from the newest main
          # instead of trying to rebase/merge competing generated JSON files.
          for attempt in 2 3; do
            echo "::warning::Push raced with another run; regenerating on latest main (attempt $attempt)"
            git fetch origin main
            git reset --hard origin/main
            python fetch_index_quotes.py
            python verify_index_quote.py
            if commit_and_push; then
              exit 0
            fi
            sleep 2
          done

          echo "::error::Could not publish index data after retrying on latest main"
          exit 1
