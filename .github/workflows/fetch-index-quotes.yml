name: Fetch Eastmoney index quotes

on:
  workflow_dispatch:
  schedule:
    # Asia/Shanghai 11:30, 14:45, 15:10 on weekdays.
    - cron: "30 3 * * 1-5"
    - cron: "45 6 * * 1-5"
    - cron: "10 7 * * 1-5"
  push:
    branches:
      - main
    paths:
      - "indices.json"
      - "fetch_index_quotes.py"
      - "requirements.txt"
      - "tests/test_index_quotes.py"
      - ".github/workflows/fetch-index-quotes.yml"

permissions:
  contents: write

concurrency:
  group: fund-data-write
  cancel-in-progress: false

jobs:
  fetch-index-quotes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test index quote parsing
        run: python -m unittest tests.test_index_quotes -v

      - name: Fetch Eastmoney index quotes
        run: python fetch_index_quotes.py

      - name: Commit index data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/indices/
          if git diff --cached --quiet; then
            echo "No index quote changes."
            exit 0
          fi
          git commit -m "data: update Eastmoney index quotes"
          git pull --rebase origin main
          git push origin HEAD:main
