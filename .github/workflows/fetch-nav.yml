name: Fetch official fund NAV

on:
  workflow_dispatch:
    inputs:
      codes:
        description: "Optional fund codes, comma/space separated. Leave blank to query funds.json."
        required: false
        type: string
  schedule:
    # Asia/Shanghai: 18:37, 20:37, 22:37, 23:37 on weekdays.
    - cron: "37 10,12,14,15 * * 1-5"
  push:
    branches:
      - main
    paths:
      - "funds.json"
      - "fetch_nav.py"
      - "requirements.txt"
      - ".github/workflows/fetch-nav.yml"

permissions:
  contents: write

concurrency:
  group: fund-data-write
  cancel-in-progress: false

jobs:
  fetch-nav:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch official NAVs
        env:
          FUND_CODES: ${{ inputs.codes }}
        run: python fetch_nav.py

      - name: Commit data changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No NAV changes."
            exit 0
          fi
          git commit -m "data: update official fund NAV"
          git pull --rebase origin main
          git push origin HEAD:main
